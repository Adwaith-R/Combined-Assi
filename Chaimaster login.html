<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChaiMaster Pro — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0f0a04;
      --surface:   #1a1006;
      --card:      #201508;
      --border:    rgba(255,200,80,0.12);
      --saffron:   #FF9933;
      --saffron2:  #FFB84D;
      --green2:    #1aaa0a;
      --deep-red:  #C0392B;
      --cream:     #FFF5E6;
      --muted:     #9a8870;
      --text:      #f0e6d3;
      --error:     #e05050;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Tricolour bar */
    .tricolour-bar {
      position: fixed; top:0; left:0; right:0; height:4px; z-index:200;
      background: linear-gradient(90deg, #FF9933 33.3%, #ffffff 33.3% 66.6%, #138808 66.6%);
    }

    /* Background layers */
    .bg-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-glow {
      position: absolute; border-radius: 50%; filter: blur(130px);
    }
    .bg-glow-1 { width:600px; height:600px; background: rgba(255,153,51,0.13); top:-200px; right:-150px; }
    .bg-glow-2 { width:400px; height:400px; background: rgba(192,57,43,0.1); bottom:-100px; left:-100px; }
    .bg-glow-3 { width:300px; height:300px; background: rgba(19,136,8,0.07); top:50%; left:50%; transform:translate(-50%,-50%); }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,153,51,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,153,51,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* Mandala SVG */
    .mandala-bg {
      position: fixed;
      opacity: 0.05;
      pointer-events: none;
      bottom: -100px; left: -100px;
      width: 500px; height: 500px;
    }

    /* Card */
    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      padding: 20px;
      animation: fadeInUp 0.7s cubic-bezier(0.34,1.2,0.64,1) both;
    }
    @keyframes fadeInUp {
      from { opacity:0; transform: translateY(36px) scale(0.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 40px 40px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,200,80,0.06);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content:'';
      position:absolute; top:-80px; right:-80px;
      width:240px; height:240px;
      background: radial-gradient(circle, rgba(255,153,51,0.1), transparent 70%);
      border-radius:50%;
    }

    /* Logo */
    .logo {
      font-family: 'Yatra One', cursive;
      font-size: 1.7rem;
      color: var(--cream);
      margin-bottom: 6px;
    }
    .logo span { color: var(--saffron); }
    .logo-sub {
      font-size: 0.72rem; font-weight:600; letter-spacing:0.1em;
      text-transform:uppercase; color: var(--green2);
    }

    .login-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 22px 0;
    }

    .login-title {
      font-family: 'Yatra One', cursive;
      font-size: 1.55rem; color: var(--cream);
      margin-bottom: 6px;
    }
    .login-sub { font-size:0.84rem; color:var(--muted); margin-bottom:28px; }

    /* Tab switcher */
    .tab-row {
      display: flex; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex:1; padding: 9px 0;
      border: none; background: transparent;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem; font-weight:600;
      color: var(--muted); cursor:pointer;
      transition: all var(--transition);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #FF9933, #e07010);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255,153,51,0.3);
    }

    /* Form */
    .form-group { margin-bottom: 18px; position: relative; }
    .form-label {
      display: block; font-size:0.78rem; font-weight:600;
      letter-spacing:0.05em; color:var(--muted);
      margin-bottom:8px; text-transform:uppercase;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 16px; top:50%; transform:translateY(-50%);
      font-size: 1rem; pointer-events:none;
    }
    .form-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px 13px 44px;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-input::placeholder { color: var(--muted); }
    .form-input:focus {
      border-color: rgba(255,153,51,0.5);
      box-shadow: 0 0 0 3px rgba(255,153,51,0.08);
    }
    .form-input.error { border-color: var(--error); }

    .eye-toggle {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:var(--muted); cursor:pointer;
      font-size:0.9rem; transition: color var(--transition);
    }
    .eye-toggle:hover { color: var(--text); }

    .form-row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:22px;
    }
    .checkbox-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; }
    .checkbox-wrap input { display:none; }
    .custom-check {
      width:18px; height:18px; border-radius:5px;
      border: 1px solid var(--border); background: var(--surface);
      display:flex; align-items:center; justify-content:center;
      transition: all var(--transition); flex-shrink:0;
    }
    .checkbox-wrap input:checked ~ .custom-check {
      background: var(--saffron); border-color: var(--saffron);
    }
    .custom-check::after {
      content:'✓'; font-size:0.65rem; color:#fff; opacity:0;
      transition: opacity var(--transition);
    }
    .checkbox-wrap input:checked ~ .custom-check::after { opacity:1; }
    .check-label { font-size:0.8rem; color:var(--muted); user-select:none; }
    .forgot-link { font-size:0.8rem; color:var(--saffron); text-decoration:none; }
    .forgot-link:hover { text-decoration: underline; }

    /* Buttons */
    .btn-primary {
      width:100%; padding: 14px;
      background: linear-gradient(135deg, #FF9933, #e07010);
      border:none; border-radius: 12px;
      font-family:'Poppins',sans-serif; font-weight:700; font-size:0.92rem;
      color:#fff; cursor:pointer; letter-spacing:0.03em;
      transition: all var(--transition);
      box-shadow: 0 4px 20px rgba(255,153,51,0.3);
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #FFB84D, #FF9933);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255,153,51,0.45);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary.loading { opacity:0.7; pointer-events:none; }

    .or-divider {
      display:flex; align-items:center; gap:12px;
      margin: 20px 0; color:var(--muted); font-size:0.78rem;
    }
    .or-divider::before, .or-divider::after {
      content:''; flex:1; height:1px; background:var(--border);
    }

    .btn-google {
      width:100%; padding:12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius:12px; font-family:'Poppins',sans-serif;
      font-size:0.86rem; font-weight:600; color:var(--text);
      cursor:pointer; transition: all var(--transition);
      display:flex; align-items:center; justify-content:center; gap:10px;
    }
    .btn-google:hover { border-color:rgba(255,153,51,0.3); color:var(--saffron); }

    .switch-text {
      text-align:center; margin-top:22px;
      font-size:0.82rem; color:var(--muted);
    }
    .switch-text a { color:var(--saffron); text-decoration:none; font-weight:600; }
    .switch-text a:hover { text-decoration:underline; }

    /* Error message */
    .err-msg {
      font-size:0.76rem; color:var(--error);
      margin-top:6px; display:none;
    }
    .err-msg.show { display:block; }

    /* Toast */
    #toast {
      position:fixed; bottom:24px; right:20px;
      background:var(--card); border:1px solid rgba(255,153,51,0.3);
      border-radius:12px; padding:12px 18px;
      font-size:0.84rem; color:var(--text);
      display:flex; align-items:center; gap:9px;
      transform:translateY(60px); opacity:0;
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      z-index:300; pointer-events:none;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }
    #toast.show { transform:translateY(0); opacity:1; }

    /* Spinner */
    .spinner {
      width:18px; height:18px; border:2px solid rgba(255,255,255,0.3);
      border-top-color:#fff; border-radius:50%;
      animation: spin 0.7s linear infinite; display:none;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Sign-up extra field */
    #signupFields { display:none; }
    #signupFields.show { display:block; }

    @media(max-width:480px){
      .login-card { padding:36px 24px 30px; }
    }
  </style>
</head>
<body>
<div class="tricolour-bar"></div>

<div class="bg-layer">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="bg-grid"></div>
</div>

<svg class="mandala-bg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FF9933" stroke-width="0.5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#FF9933" stroke-width="0.5" stroke-dasharray="4 6"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#FF9933" stroke-width="0.5"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#FF9933" stroke-width="0.5" stroke-dasharray="2 4"/>
  <g stroke="#FF9933" stroke-width="0.4" fill="none">
    <line x1="100" y1="10" x2="100" y2="190"/>
    <line x1="10" y1="100" x2="190" y2="100"/>
    <line x1="27" y1="27" x2="173" y2="173"/>
    <line x1="173" y1="27" x2="27" y2="173"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(22.5 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(45 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(67.5 100 100)"/>
  </g>
</svg>

<div class="login-wrap">
  <div class="login-card">
    <!-- Logo -->
    <div class="logo">ChaiMaster<span>Pro</span></div>
    <div class="logo-sub">🇮🇳 Made in India</div>

    <div class="login-divider"></div>

    <div class="login-title" id="formTitle">Welcome Back ☕</div>
    <p class="login-sub" id="formSub">Sign in to your ChaiMaster account</p>

    <!-- Tab switcher -->
    <div class="tab-row">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

      <!-- Sign-up extra: Name -->
      <div class="form-group" id="signupFields">
        <label class="form-label">Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input class="form-input" id="nameInput" type="text" placeholder="Your full name" />
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input class="form-input" id="emailInput" type="email" placeholder="your@email.com" />
        </div>
        <div class="err-msg" id="emailErr">Please enter a valid email address.</div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input class="form-input" id="passInput" type="password" placeholder="••••••••" />
          <button type="button" class="eye-toggle" id="eyeBtn" onclick="togglePass()">👁️</button>
        </div>
        <div class="err-msg" id="passErr">Password must be at least 6 characters.</div>
      </div>

      <!-- Remember / Forgot -->
      <div class="form-row" id="rememberRow">
        <label class="checkbox-wrap">
          <input type="checkbox" id="rememberMe" />
          <div class="custom-check"></div>
          <span class="check-label">Remember me</span>
        </label>
        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <div class="spinner" id="spinner"></div>
        <span id="submitText">Sign In →</span>
      </button>

      <div class="or-divider">or continue with</div>

      <button type="button" class="btn-google" onclick="showToast('Google sign-in coming soon!')">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M5.27 9.76A7.08 7.08 0 0 1 19.07 12h-7.1v3h4.07A4.1 4.1 0 0 1 12 18.08a4.1 4.1 0 0 1-2.74-1.05l-3 2.36A7.07 7.07 0 0 0 19.07 12c0-.48-.05-.94-.13-1.4H5.27z"/><path fill="#34A853" d="M5.27 14.24A7.08 7.08 0 0 0 12 19.08a7.07 7.07 0 0 0 4.07-1.4l-3-2.36a4.1 4.1 0 0 1-6.07-2.41l-1.73 1.33z"/><path fill="#FBBC05" d="M3.53 7.36A7.08 7.08 0 0 0 4.93 14.24l1.73-1.33A4.06 4.06 0 0 1 7.9 4.92L5.27 2.64A7.06 7.06 0 0 0 3.53 7.36z"/><path fill="#4285F4" d="M12 4.92a4.1 4.1 0 0 1 2.74 1.05l2.36-2.36A7.07 7.07 0 0 0 5.27 2.64L7.9 4.92A4.1 4.1 0 0 1 12 4.92z"/></svg>
        Continue with Google
      </button>

      <div class="switch-text" id="switchText">
        Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Create one free →</a>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast"><span>☕</span><span id="toastMsg">Welcome!</span></div>

<script>
  let currentTab = 'login';
  let passVisible = false;

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');

    const isSignup = tab === 'signup';
    document.getElementById('signupFields').classList.toggle('show', isSignup);
    document.getElementById('formTitle').textContent  = isSignup ? 'Create Account ☕' : 'Welcome Back ☕';
    document.getElementById('formSub').textContent    = isSignup ? 'Join 50,000+ chai lovers today' : 'Sign in to your ChaiMaster account';
    document.getElementById('submitText').textContent = isSignup ? 'Create Account →' : 'Sign In →';
    document.getElementById('rememberRow').style.display = isSignup ? 'none' : 'flex';
    document.getElementById('forgotLink').style.display  = isSignup ? 'none' : 'block';
    document.getElementById('switchText').innerHTML = isSignup
      ? 'Already have an account? <a href="#" onclick="switchTab(\'login\'); return false;">Sign in →</a>'
      : 'Don\'t have an account? <a href="#" onclick="switchTab(\'signup\'); return false;">Create one free →</a>';
    clearErrors();
  }

  function togglePass() {
    passVisible = !passVisible;
    const inp = document.getElementById('passInput');
    inp.type = passVisible ? 'text' : 'password';
    document.getElementById('eyeBtn').textContent = passVisible ? '🙈' : '👁️';
  }

  function clearErrors() {
    document.querySelectorAll('.err-msg').forEach(e => e.classList.remove('show'));
    document.querySelectorAll('.form-input').forEach(i => i.classList.remove('error'));
  }
function handleLogin(e) {
  e.preventDefault();
  clearErrors();

  const email = document.getElementById('emailInput').value.trim();
  const pass  = document.getElementById('passInput').value;
  const name  = document.getElementById('nameInput').value.trim();

  let valid = true;

  // Validation
  if (!email || !/\S+@\S+\.\S+/.test(email)) {
    document.getElementById('emailInput').classList.add('error');
    document.getElementById('emailErr').classList.add('show');
    valid = false;
  }

  if (pass.length < 6) {
    document.getElementById('passInput').classList.add('error');
    document.getElementById('passErr').classList.add('show');
    valid = false;
  }

  if (!valid) return;

  // UI Loading
  const btn = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const text = document.getElementById('submitText');

  btn.classList.add('loading');
  spinner.style.display = 'block';
  text.textContent = currentTab === 'login' ? 'Signing in…' : 'Creating account…';

  setTimeout(() => {

    btn.classList.remove('loading');
    spinner.style.display = 'none';
    text.textContent = currentTab === 'login' ? 'Sign In →' : 'Create Account →';

    // ================= LOGIN =================
    if (currentTab === 'login') {

      // ✅ Admin Login
      if (email === 'admin@chaimaster.in' && pass === 'admin123') {
        showToast('Welcome back, Admin! ☕');
        setTimeout(() => {
          window.location.href = 'Chaimaster-admin.html';
        }, 1200);
        return;
      }

      // ✅ User Login (check saved user)
      const storedUser = JSON.parse(localStorage.getItem('user'));

      if (!storedUser) {
        showToast('No account found. Please sign up first.');
        return;
      }

      if (email === storedUser.email && pass === storedUser.password) {
        showToast('Login successful! ☕');
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 1200);
      } else {
        showToast('Invalid email or password ❌');
      }

    }

    // ================= SIGNUP =================
    else {

      if (!name) {
        showToast('Please enter your name');
        return;
      }

      const user = {
        name: name,
        email: email,
        password: pass
      };

      localStorage.setItem('user', JSON.stringify(user));

      showToast('Account created successfully! 🎉');
      switchTab('login');
    }

  }, 1800);
}
  let toastTimer;

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
  }, 3200);
}
</script>
</body>
</html>
